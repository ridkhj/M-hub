<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Hub — Painel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-4" style="max-width: 1200px;">
        <header class="mb-4">
            <h1 class="h3">🎵 Music Hub — Painel</h1>
            <p class="text-muted">Vanilla JS + Bootstrap, para um simples gerênciamento de louvores</p>
            <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
        </header>

        <div class="row g-4">
            <section class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-primary text-white fw-bold">Músicas</div>
                    <div class="card-body">
                        <form id="form-musica" class="row g-2 mb-3">
                            <div class="col-12">
                                <input type="text" id="musica-nome" class="form-control" placeholder="Nome da música"
                                    required>
                            </div>
                            <div class="col-6">
                                <input type="number" id="musica-bpm" class="form-control" placeholder="BPM (Opcional)"
                                    min="0">
                            </div>
                            <div class="col-6">
                                <input type="text" id="musica-tom" class="form-control" placeholder="Tom Original"
                                    required>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary w-100">
                                    Adicionar Música
                                </button>
                            </div>
                        </form>
                        <ul id="lista-musicas" class="list-group"></ul>
                    </div>
                </div>
            </section>

            <section class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-success text-white fw-bold">Cantores</div>
                    <div class="card-body">
                        <form id="form-cantor" class="row g-2 mb-3">
                            <div class="col-12">
                                <input type="text" id="cantor-nome" class="form-control" placeholder="Nome do cantor"
                                    required>
                            </div>
                            <div class="col-12">
                                <select id="cantor-sexo" class="form-select" required>
                                    <option value="">Selecione o sexo...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success w-100">
                                    Adicionar Cantor
                                </button>
                            </div>
                        </form>
                        <ul id="lista-cantores" class="list-group"></ul>
                    </div>
                </div>
            </section>

            <section class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-warning text-dark fw-bold">Repertórios</div>
                    <div class="card-body">
                        <form id="form-repertorio" class="row g-2 mb-3">
                            <div class="col-12">
                                <input type="text" id="rep-titulo" class="form-control"
                                    placeholder="Título (Ex: Culto de Domingo)" required>
                            </div>
                            <div class="col-12">
                                <input type="date" id="rep-data" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-warning w-100">
                                    Adicionar Repertório
                                </button>
                            </div>
                        </form>
                        <ul id="lista-repertorios" class="list-group"></ul>
                    </div>
                </div>
            </section>

            <section class="col-lg-6">
                <div class="card">
                    <div class="card-header bg-dark text-white fw-bold">Itens do Repertório (Setlist)</div>
                    <div class="card-body">
                        <form id="form-item" class="row g-2 mb-3">
                            <div class="col-12">
                                <select id="item-repertorio" class="form-select" required>
                                    <option value="">Selecione o Repertório...</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <select id="item-musica" class="form-select" required>
                                    <option value="">Selecione a Música...</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <select id="item-cantor" class="form-select" required>
                                    <option value="">Selecione o Cantor...</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <input type="text" id="item-tom" class="form-control" placeholder="Tom Execução"
                                    required>
                            </div>
                            <div class="col-6">
                                <input type="number" id="item-ordem" class="form-control" placeholder="Ordem (Ex: 1)"
                                    min="1" required>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-dark w-100">
                                    Adicionar Item à Setlist
                                </button>
                            </div>
                        </form>
                        <ul id="lista-itens" class="list-group"></ul>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
